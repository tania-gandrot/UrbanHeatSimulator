
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>UrbanHeatSimulator</title>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
}

#container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

canvas{
    border:1px solid black;
    background:white;
}

#info{
    margin-top:20px;
    padding:10px;
    background:white;
    border:1px solid #ccc;
    display:inline-block;
    min-width:300px;
}

</style>
</head>

<body>

<h1>🌡️ UrbanHeatSimulator</h1>

<div id="container">

    <div>
        <h2>🏙️ Ville</h2>
        <canvas id="city" width="600" height="600"></canvas>
    </div>

    <div>
        <h2>🔥 Chaleur</h2>
        <canvas id="heat" width="600" height="600"></canvas>
    </div>

</div>

<div id="info">
Survole une case
</div>

<script>

// =====================
// PARAMETRES
// =====================

const SIZE = 20;
const CELL = 30;

// =====================
// CANVAS
// =====================

const cityCanvas =
document.getElementById("city");

const heatCanvas =
document.getElementById("heat");

const cityCtx =
cityCanvas.getContext("2d");

const heatCtx =
heatCanvas.getContext("2d");

const info =
document.getElementById("info");

// =====================
// SURVOL
// =====================

let hoveredX = -1;
let hoveredY = -1;

// =====================
// MONDE
// =====================

let grid = [];

function createWorld(){

    grid = [];

    for(let y=0;y<SIZE;y++){

        let row = [];

        for(let x=0;x<SIZE;x++){

            let r = Math.random();

            let type = "concrete";

            if(r < 0.15){
                type = "tree";
            }
            else if(r < 0.20){
                type = "water";
            }
            else if(r < 0.35){
                type = "building";
            }

            row.push({
                type:type,
                temp:20
            });
        }

        grid.push(row);
    }
}

createWorld();

// =====================
// TEMPERATURE
// =====================


function updateTemperature(){

    let newTemps = [];

    for(let y=0;y<SIZE;y++){

        let row = [];

        for(let x=0;x<SIZE;x++){

            let cell = grid[y][x];

            let temp = cell.temp;

            // Soleil

            switch(cell.type){

                case "tree":
                    temp -= 0.002;
                    break;

                case "water":
                    temp -= 0.004;
                    break;

                case "building":
                    temp += 0.006;
                    break;

                case "concrete":
                    temp += 0.008;
                    break;
        }

            // Diffusion thermique

            let neighbours = [];
            
            if(y > 0)
                neighbours.push(
                    grid[y-1][x].temp
                );

            if(y < SIZE-1)
                neighbours.push(
                    grid[y+1][x].temp
                );

            if(x > 0)
                neighbours.push(
                    grid[y][x-1].temp
                );

            if(x < SIZE-1)
                neighbours.push(
                    grid[y][x+1].temp
                );

            let average =
                neighbours.reduce(
                    (a,b)=>a+b,
                    0
                ) / neighbours.length;

            temp +=
                (average - temp)
                * 0.05;

            temp =
                Math.max(
                    0,
                    Math.min(100,temp)
                );

            row.push(temp);
        }

        newTemps.push(row);
    }

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            grid[y][x].temp =
                newTemps[y][x];
        }
    }
}

// =====================
// COULEURS TERRAIN
// =====================

function terrainColor(type){

    switch(type){

        case "tree":
            return "green";

        case "water":
            return "dodgerblue";

        case "building":
            return "#444";

        default:
            return "#dddddd";
    }
}

// =====================
// COULEURS CHALEUR
// =====================

function heatColor(temp){

    let ratio = temp / 100;

    let red =
        Math.floor(255 * ratio);

    let blue =
        Math.floor(255 * (1-ratio));

    return `rgb(${red},0,${blue})`;
}

// =====================
// CARTE VILLE
// =====================

function drawCity(){

    cityCtx.clearRect(
        0,
        0,
        cityCanvas.width,
        cityCanvas.height
    );

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            let cell = grid[y][x];

            cityCtx.fillStyle =
                terrainColor(cell.type);

            cityCtx.fillRect(
                x*CELL,
                y*CELL,
                CELL,
                CELL
            );

            cityCtx.strokeStyle =
                "black";

            cityCtx.strokeRect(
                x*CELL,
                y*CELL,
                CELL,
                CELL
            );

            if(
                x === hoveredX &&
                y === hoveredY
            ){

                cityCtx.strokeStyle =
                    "yellow";

                cityCtx.lineWidth = 4;

                cityCtx.strokeRect(
                    x*CELL,
                    y*CELL,
                    CELL,
                    CELL
                );

                cityCtx.lineWidth = 1;
            }
        }
    }
}

// =====================
// CARTE THERMIQUE
// =====================

function drawHeat(){

    heatCtx.clearRect(
        0,
        0,
        heatCanvas.width,
        heatCanvas.height
    );

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            let cell = grid[y][x];

            heatCtx.fillStyle =
                heatColor(cell.temp);

            heatCtx.fillRect(
                x*CELL,
                y*CELL,
                CELL,
                CELL
            );

            heatCtx.strokeStyle =
                "black";

            heatCtx.strokeRect(
                x*CELL,
                y*CELL,
                CELL,
                CELL
            );

            if(
                x === hoveredX &&
                y === hoveredY
            ){

                heatCtx.strokeStyle =
                    "yellow";

                heatCtx.lineWidth = 4;

                heatCtx.strokeRect(
                    x*CELL,
                    y*CELL,
                    CELL,
                    CELL
                );

                heatCtx.lineWidth = 1;
            }
        }
    }
}

// =====================
// SURVOL
// =====================

cityCanvas.addEventListener(
"mousemove",
function(e){

    const rect =
        cityCanvas.getBoundingClientRect();

    const x =
        Math.floor(
            (e.clientX - rect.left)
            / CELL
        );

    const y =
        Math.floor(
            (e.clientY - rect.top)
            / CELL
        );

    hoveredX = x;
    hoveredY = y;

    if(
        grid[y] &&
        grid[y][x]
    ){

        let cell =
            grid[y][x];

        info.innerHTML = `
            <b>Type :</b> ${cell.type}<br>
            <b>Température :</b> ${cell.temp.toFixed(1)} °C<br>
            <b>Coordonnées :</b> (${x},${y})
        `;
    }
});

// =====================
// BOUCLE
// =====================

function loop(){

    updateTemperature();

    drawCity();

    drawHeat();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
